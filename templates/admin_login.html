{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="card narrow login-card">
  <h1>Admin Login</h1>
  <p class="muted">Sign in to access the administration dashboard.</p>

  <form method="POST">
    <label for="username">Admin Username</label>
    <input
      type="text"
      id="username"
      name="username"
      required
      autofocus
    >

    <label for="password">Admin Password</label>
    <input
      type="password"
      id="password"
      name="password"
      required
    >

    <button type="submit" class="btn">Admin Login</button>
  </form>

  <p class="login-switch">
    Are you a player?
    <a href="{{ url_for('login') }}">Player Login</a>
  </p>
</div>
{% endblock %}
